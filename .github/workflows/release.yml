# =============================================================================
# glnc release workflow
# =============================================================================
#
# Builds native `bun build --compile` binaries for four targets, runs a smoke
# test on each native runner, computes SHA256 checksums, tarballs the binaries,
# and publishes a GitHub Release with the artifacts.
#
# How to cut a release:
#   1. Bump the "version" field in package.json.
#   2. Commit and push to main.
#   3. Tag the release: `git tag v1.2.3 && git push origin v1.2.3`
#      - Tags matching v*.*.*   -> stable release
#      - Tags matching v*.*.*-* -> pre-release (rc/beta/alpha)
#   4. This workflow runs automatically. You can also trigger manually via the
#      Actions tab ("Run workflow") for testing — manual runs build artifacts
#      but skip the GitHub Release publish step (no tag context).
#
# TODO(release): Add macOS code-signing + notarization once we have an Apple
#   Developer ID. For now darwin binaries ship unsigned and users will see a
#   Gatekeeper warning on first launch.
# TODO(release): Add Windows (bun-windows-x64) once v1 ships and we validate
#   the Bun Windows compile target on a real workload.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Cancel in-progress runs for the same ref (tag) so a re-tag supersedes a
# stale build cleanly.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.13"

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            runner: macos-14
            asset_name: glnc-darwin-arm64
            os_family: darwin
            native: true
          # darwin-x64 is CROSS-COMPILED on a Linux runner. Bun supports
          # cross-compiling --target=bun-darwin-x64 from any host. We avoid
          # the macos-13 free-tier runner pool (frequently 30+ min queued).
          # Smoke test is gated on `native: true` so it skips on this entry.
          - target: bun-darwin-x64
            runner: ubuntu-latest
            asset_name: glnc-darwin-x64
            os_family: linux
            native: false
          # NOTE on linux/arm64: GitHub-hosted `ubuntu-24.04-arm` runners are
          # generally available for public repos as of 2025 (free tier). We use
          # them so the binary is built natively — `bun build --compile`
          # cross-compiles to ARM from x64 just fine, but running the smoke
          # test requires either a native runner or qemu. A native ARM runner
          # is the simplest, lowest-risk path. If this repo ever goes private
          # on a plan without ARM minutes, swap `runner` to `ubuntu-latest`
          # and gate the smoke test on `matrix.native`.
          - target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            asset_name: glnc-linux-arm64
            os_family: linux
            native: true
          - target: bun-linux-x64
            runner: ubuntu-latest
            asset_name: glnc-linux-x64
            os_family: linux
            native: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: Build binary (${{ matrix.target }})
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bun build \
            --compile \
            --minify \
            --sourcemap \
            --target=${{ matrix.target }} \
            ./bin/glnc.js \
            --outfile dist/${{ matrix.asset_name }}

      - name: Smoke test (--version)
        if: matrix.native == true
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "dist/${{ matrix.asset_name }}"
          OUTPUT="$("dist/${{ matrix.asset_name }}" --version)"
          echo "binary --version output: ${OUTPUT}"

          # Expected version: prefer the tag (strip leading 'v'), fall back to
          # package.json on workflow_dispatch runs without a tag.
          REF="${GITHUB_REF_NAME:-}"
          if [[ "${REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            EXPECTED="${REF#v}"
          else
            EXPECTED="$(node -p "require('./package.json').version")"
          fi
          echo "expected version: ${EXPECTED}"

          if ! echo "${OUTPUT}" | grep -Fq "${EXPECTED}"; then
            echo "::error::Smoke test failed: --version output did not contain '${EXPECTED}'"
            exit 1
          fi

      - name: Create tarball
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dist/${{ matrix.asset_name }}.tar.gz" \
            -C dist "${{ matrix.asset_name }}"
          ls -lh "dist/${{ matrix.asset_name }}.tar.gz"

      # Single source of truth for checksums: the aggregated SHA256SUMS file
      # produced by the `release` job hashes the tarball (what consumers
      # actually verify). Per-binary hashes were unused and dropped.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    # Only publish a Release when triggered by a tag push. workflow_dispatch
    # runs still produce artifacts (downloadable from the run page) but won't
    # create a Release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files and aggregate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Move tarballs to release/ and concatenate per-asset .sha256 files
          # into a single SHA256SUMS file (Homebrew + manual verifiers like it).
          : > release/SHA256SUMS
          for dir in artifacts/*/; do
            name="$(basename "${dir}")"
            cp "${dir}${name}.tar.gz" "release/${name}.tar.gz"
            # Re-compute checksum against the tarball (the per-job .sha256 was
            # for the raw binary; downstream consumers want the tarball hash).
            ( cd release && sha256sum "${name}.tar.gz" >> SHA256SUMS )
          done
          echo "----- SHA256SUMS -----"
          cat release/SHA256SUMS
          echo "----- release/ -----"
          ls -lh release/

      - name: Determine prerelease status
        id: prerelease
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # v1.2.3-rc.1 / v1.2.3-beta / v1.2.3-alpha.2 -> prerelease
          # v1.2.3                                    -> stable
          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prerelease.outputs.tag }}
          name: ${{ steps.prerelease.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS

  bump-homebrew-tap:
    name: Bump Homebrew tap
    needs: release
    # Only fire the tap bump on stable tag releases. Prereleases skip the bump
    # so `brew install glnc` keeps pointing at the latest stable version.
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Compute version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      # Required secret:
      #   HOMEBREW_TAP_DISPATCH_TOKEN — fine-grained PAT scoped ONLY to
      #   github.com/aryarahimi1/homebrew-glnc, with `Contents: read & write` and
      #   `Metadata: read`. Used to fire repository_dispatch on the tap repo.
      #   Rotate at least once a year (or when a maintainer leaves).
      - name: Dispatch tap bump
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          repository: aryarahimi1/homebrew-glnc
          event-type: glnc-released
          client-payload: |
            {
              "version": "${{ steps.ver.outputs.version }}",
              "tag": "${{ github.ref_name }}",
              "release_url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            }
